name: OpenWebUI
services:
  OpenWebUI:
    image: ghcr.io/open-webui/open-webui:v0.11.1@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16
    container_name: OpenWebUI
    restart: unless-stopped
    hostname: openwebui
    networks:
      - OpenWebUI
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - CORS_ALLOW_ORIGIN=https://${OPENWEBUI_HOST}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENABLE_IMAGE_GENERATION=false
      - ENABLE_OLLAMA_API=false
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUMES}/OpenWebUI:/app/backend/data

    user: "${UID}:${GID}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: journald

    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
          pids: 256

networks:
  OpenWebUI:
    name: OpenWebUI
    external: true
